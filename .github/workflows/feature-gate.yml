name: feature-gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: feature-gate を実行する（main に載った後は main の policy）
        run: |
          set -euo pipefail
          if git cat-file -e origin/main:policy/grow.rego 2>/dev/null; then
            tmp="$(mktemp -d)"
            git archive origin/main policy scripts | tar -x -C "$tmp"
            HARNESS_ROOT="$GITHUB_WORKSPACE" OPA_POLICY_DIR="$tmp/policy" \
              node "$tmp/scripts/feature-gate.mjs"
          else
            node scripts/feature-gate.mjs
          fi
      - name: ハーネス単体テスト
        run: node --test scripts/cycle-metrics.test.mjs scripts/commit-msg-lint.test.mjs scripts/git-commit-cmd.test.mjs scripts/commit-guard.test.mjs scripts/blocked-env.test.mjs scripts/lint-commit-range.test.mjs
      - name: コミット主語を検査する
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_HEAD}" ]; then
            node scripts/lint-commit-range.mjs --tip "${PR_HEAD}"
          else
            node scripts/lint-commit-range.mjs --tip
          fi

