name: feature-gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: feature-gate を実行する（main に載った後は main の policy）
        run: |
          set -euo pipefail
          if git cat-file -e origin/main:policy/grow.rego 2>/dev/null; then
            tmp="$(mktemp -d)"
            git archive origin/main policy scripts | tar -x -C "$tmp"
            HARNESS_ROOT="$GITHUB_WORKSPACE" OPA_POLICY_DIR="$tmp/policy" \
              node "$tmp/scripts/feature-gate.mjs"
          else
            node scripts/feature-gate.mjs
          fi
      - name: ハーネス単体テスト
        run: node --test scripts/cycle-metrics.test.mjs scripts/commit-msg-lint.test.mjs scripts/git-commit-cmd.test.mjs scripts/commit-guard.test.mjs scripts/blocked-env.test.mjs scripts/lint-commit-range.test.mjs scripts/knowledge-catalog.test.mjs
      # 導入中は PR ワークスペースの scripts を使う。main に載った次 PR で origin/main に切り替える（ADR 0043）。
      - name: 三層知識カタログの鮮度と OPA 突合（PR ワークスペースの scripts）
        run: |
          set -euo pipefail
          test -x .tools/opa
          node scripts/knowledge-catalog.mjs --check
          node --test scripts/knowledge-catalog.opa.test.mjs
      - name: コミット主語を検査する
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          lint_script="scripts/lint-commit-range.mjs"
          if git cat-file -e origin/main:scripts/lint-commit-range.mjs 2>/dev/null; then
            tmp="$(mktemp -d)"
            git archive origin/main scripts | tar -x -C "$tmp"
            lint_script="$tmp/scripts/lint-commit-range.mjs"
          fi
          if [ -n "${PR_HEAD}" ]; then
            node "$lint_script" --tip "${PR_HEAD}"
          else
            node "$lint_script" --tip
          fi
