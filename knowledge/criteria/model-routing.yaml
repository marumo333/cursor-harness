# ハーネス席 — ADR 0031 / 0033 / 0037 / 0039
harness_agents:
  chat_orchestrator: grok-4.5-fast-xhigh
  opus_gates:
    - plan-confirm
    - review_default
    - verifier
    - reflector
  review_trio:
    - model: claude-opus-5-thinking-high
    - model: grok-4.5-fast-xhigh
    - model: gpt-5.6-sol-medium
  sonnet_pin: claude-sonnet-5-thinking-high
  fable_exception: claude-fable-5-thinking-high
  budget_guards:
    parent_chat: grok-only
    opus_input: artifacts-only
    sol_seat: review_trio_only
    fable_seat: explicit-ceiling-only
    trio_when: high-risk-only
    plan_confirm_when: before-fanout-only
    no_generic_task_as_gate: true
    no_fable_opus_cohabit_trio: true
