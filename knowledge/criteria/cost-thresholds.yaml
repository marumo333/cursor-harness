# コスト閾値 — 出典: ADR 0004 / 0010 / 0011（¥150/$ 概算）
gpu: # 27B serve の選択肢（LlmPort で差替）
  default_mode: vast-verified
  vast_verified:
    rtx4090_24gb_q4: 0.34 # $/hr（最安・既定）
    a100_80gb_fp16: 0.67 # $/hr（品質）
    note: 'verified DC host 限定・自前監視・実勢は +30〜50%'
  sovereign_mode: # 国産（推論を国内化）
    conoha_l4_24gb_q4: 1.13 # $/hr（≒¥169、月上限¥99,220）
    sakura_h100_fp16: 6.7 # $/hr（≒¥1,008）
  serverless_vs_alwayson_breakeven_hours: 730 # 月730h(24h/日)未満は秒課金が安い

billing: # ADR 0004（プリペイド）
  cost_per_request_yen: [0.3, 0.8] # 低負荷・バッチ無し想定
  credit_price_multiplier: [3, 5] # 原価×数倍で常に黒字
  hard_stop_on_zero_balance: true

outcome_billing: # ADR 0028 Phase 2（成果課金・W2 M3）
  take_rate: 0.015 # 1.5%（決済テイクレート・Phase 3 用定数。Stripe 実装は別波）
  outcome_fee_credits: 10 # payout_received|invoice_paid の固定 outcome_fee
  fee_trigger_types: [payout_received, invoice_paid] # これ以外の outcome_events は課金しない

infra_monthly: # 現実解（個人・§DESIGN 参照）
  supabase_pro_usd: 25
  cloudflare_usd: 5
  breakeven_users_free_tier: [1, 2]
  breakeven_users_pro: [7, 8]
