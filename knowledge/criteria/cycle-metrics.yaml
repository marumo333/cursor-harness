# サイクル3指標 — ADR 0039。実装は scripts/cycle-metrics.mjs / policy/cycle.rego
thresholds:
  node_skip_rate_max: 0
  edge_skip_rate_max: 0
  state_integrity_min: 1
recurse:
  require_human_approved: true
  require_merged_env: true
  forbid_if_open_cycle_pr: true
  forbid_unless_skip_or_fail: true
  forbid_if_pending_followup: true
terminal_states: [used, skipped, failed, approved]
