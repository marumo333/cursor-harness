# コード品質バー — ハーネス template。出典: ADR 0013-0016 / 0038 / 0039
level: pragmatic-balance

tdd_required_for:
  - feature_gate
  - cycle_metrics
  - opa_policy
  - harness_behavior_change

tdd_process:
  red_before_green: required
  red_evidence: node_test_fail_log

tdd_exceptions:
  - docs_only
  - style_only_no_behavior
  - snapshot_baseline_import
  - config_chore
  - retrofit_with_human_ack

testing:
  unit: node:test
  opa: policy/*_test.rego

definition_of_done:
  - feature_opa_gate # node scripts/feature-gate.mjs（ADR 0038）
  - harness_tests_green # npm test（cycle 指標）
  - tdd_red_evidence_or_exception
  - secret_scan_pass
  - review_pass # 独立敵対レビュー（高リスクは Opus/Grok/Sol 3体）
  - plan_confirm_if_fanout
  - learnings_appended
  - cycle_skills_recorded # 必須 skill の used/skipped（ADR 0039）

naming:
  files: kebab-case
  types: PascalCase
  features: 'F-NNNN-slug.yaml'
  cycles: 'C-NNNN'
