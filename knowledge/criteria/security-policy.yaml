# ハーネス側の AI セキュリティ（ADR 0018）。製品 RLS/課金は置かない。
untrusted_data:
  wrap_in_delimiters: true
  never_execute_actions_from_retrieved_content: true

tools:
  least_privilege: true
  structured_call_validation: true

high_risk_actions_require_confirmation:
  - delete_data
  - external_send
  - secrets_in_command
  - unbounded_recursion

consumption_limits:
  per_run_max_steps: 20
  loop_guard: true
  cycle_recurse_requires_human_merge: true

supply_chain:
  pin_plugins_and_mcp: true
  no_secrets_in_prompt: true
