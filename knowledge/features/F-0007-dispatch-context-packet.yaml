  title: ディスパッチ packet（context_mode と親の effort 上書き）
  kind: harness-grow
  status: proposed
  source: human
  created: '2026-09-10'
  learning_refs:
    - knowledge/learnings.md
  problem: >
    ゲートは isolated（新しい文脈・成果物のみ）だが、親が子に何を継ぐかは語彙が無い。
    会話 fork と診断成果物の継承が混ざり、1周1再注入が壊れる。
    席と effort は YAML 固定のままで、記事側の「親がノード属性を書く」上書きが正本に無い。
    形を TypeScript に置くと消える型になり、Rego 入場と二重化する。
